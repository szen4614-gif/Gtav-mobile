name: N11 Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:

    name: Build N11 4.0 APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""


      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"


      - name: Extract N11 source
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: N11 ZIP not found."
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          rm -rf _n11_extract

          mkdir -p _n11_extract

          unzip -q "$ZIP" -d _n11_extract

          ROOT=$(find _n11_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Não foi encontrada a pasta raiz do N11."
            exit 1
          fi

          echo "Pasta N11:"
          echo "$ROOT"

          cp -a "$ROOT"/. ./


      - name: Show project structure
        run: |
          echo "===== ROOT ====="
          ls -la

          echo ""
          echo "===== N11_ANDROID ====="
          ls -la N11_ANDROID

          echo ""
          echo "===== APP ====="
          ls -la N11_ANDROID/app


      - name: Validate Android project
        run: |
          set -e

          test -d N11_ANDROID
          test -d N11_ANDROID/app

          test -f N11_ANDROID/settings.gradle.kts
          test -f N11_ANDROID/build.gradle.kts

          echo "N11 Android project structure: OK"


      - name: Install Gradle 9.4.1
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-9.4.1-bin.zip \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-9.4.1/bin" >> "$GITHUB_PATH"


      - name: Check Java and Gradle
        run: |
          java -version
          gradle --version


      - name: Build N11 Debug APK
        working-directory: N11_ANDROID
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace


      - name: Verify APK
        run: |
          APK="N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo ""
          echo "========================================"
          echo "       N11 4.0 APK GERADO"
          echo "========================================"

          ls -lh "$APK"


      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk


      - name: Verify 16 KB alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c -P 16 4 \
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk


      - name: Generate SHA256
        run: |
          APK="N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk"

          sha256sum "$APK" \
            | tee "${APK}.sha256"


      - name: Upload N11 APK
        uses: actions/upload-artifact@v4
        with:
          name: N11-4.0-debug-APK
          path: |
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
