name: N11 Launcher 7 — Master CI/CD

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: n11-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.4.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"

jobs:

  # ============================================================
  # 1. VALIDATE SOURCE
  # ============================================================

  validate:
    name: Validate N11 Source
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project structure
        run: |
          python3 scripts/validate_structure.py

      - name: Check required directories
        run: |
          test -d N11_ANDROID
          test -d N11_CORE
          test -d N11_MINECRAFT
          test -d N11_RUNTIME
          test -d N11_PERFORMANCE
          test -d N11_DIAGNOSTICS
          test -d N11_NATIVE
          test -d N11_RENDER
          test -d N11_INPUT
          test -d N11_AUDIO
          test -d N11_MODS
          test -d N11_PLUGIN
          test -d N11_STORAGE

      - name: Check configuration JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("config/n11/instance.example.json"),
              Path("config/n11/plugin.example.json"),
              Path("config/n11/runtime-manifest.example.json"),
          ]

          for f in files:
              json.loads(f.read_text())
              print("OK:", f)
          PY


  # ============================================================
  # 2. BUILD DEBUG
  # ============================================================

  debug:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Validate project
        run: |
          python3 scripts/validate_structure.py

      - name: Build Debug APK
        working-directory: N11_ANDROID
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Run Debug Lint
        working-directory: N11_ANDROID
        run: |
          gradle :app:lintDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK exists
        run: |
          test -f \
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify 16 KB ZIP alignment
        run: |
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign" \
            -c \
            -P 16 \
            4 \
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk

      - name: Generate Debug SHA256
        run: |
          sha256sum \
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk \
            | tee \
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: N11-Launcher-7-Debug
          if-no-files-found: error
          path: |
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk.sha256


  # ============================================================
  # 3. NATIVE / ELF AUDIT
  # ============================================================

  native-audit:
    name: Native ARM64 + ELF Audit
    runs-on: ubuntu-24.04
    needs: debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Build native code
        working-directory: N11_ANDROID
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Inspect APK native libraries
        run: |
          APK="N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk"

          mkdir -p native-audit

          unzip -q "$APK" \
            "lib/*" \
            -d native-audit

          echo "=== Native libraries ==="

          find native-audit \
            -type f \
            -name "*.so" \
            -print

      - name: Check ARM64 libraries
        run: |
          if find native-audit -type f -name "*.so" | grep -q .; then
            echo "Native libraries found."

            find native-audit \
              -type f \
              -name "*.so" \
              -exec file {} \;
          else
            echo "No native .so files found."
          fi

      - name: Check ELF page alignment
        run: |
          if find native-audit -type f -name "*.so" | grep -q .; then

            FAILED=0

            while IFS= read -r LIB; do

              echo ""
              echo "================================"
              echo "Checking: $LIB"
              echo "================================"

              if command -v llvm-readelf >/dev/null 2>&1; then
                llvm-readelf -l "$LIB" || FAILED=1
              elif command -v readelf >/dev/null 2>&1; then
                readelf -l "$LIB" || FAILED=1
              fi

            done < <(
              find native-audit \
                -type f \
                -name "*.so"
            )

            exit "$FAILED"

          else
            echo "No native libraries to inspect."
          fi


  # ============================================================
  # 4. RELEASE BUILD
  # ============================================================

  release:
    name: Build Release APK
    runs-on: ubuntu-24.04
    needs:
      - validate
      - native-audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Build Release
        working-directory: N11_ANDROID
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify Release APK
        run: |
          APK="N11_ANDROID/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

      - name: Verify Release alignment
        run: |
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign" \
            -c \
            -P 16 \
            4 \
            N11_ANDROID/app/build/outputs/apk/release/app-release.apk

      - name: Generate Release SHA256
        run: |
          sha256sum \
            N11_ANDROID/app/build/outputs/apk/release/app-release.apk \
            | tee \
            N11_ANDROID/app/build/outputs/apk/release/app-release.apk.sha256

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: N11-Launcher-7-Release
          if-no-files-found: error
          path: |
            N11_ANDROID/app/build/outputs/apk/release/app-release.apk
            N11_ANDROID/app/build/outputs/apk/release/app-release.apk.sha256


  # ============================================================
  # 5. SOURCE PACKAGE
  # ============================================================

  source-package:
    name: Package N11 Source
    runs-on: ubuntu-24.04
    needs:
      - validate
      - debug
      - native-audit
      - release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          mkdir -p release

          zip -r \
            release/N11_LAUNCHER_7_SOURCE.zip \
            . \
            -x ".git/*" \
            -x "N11_ANDROID/app/build/*" \
            -x "*.gradle-cache*"

      - name: Generate source SHA256
        run: |
          sha256sum \
            release/N11_LAUNCHER_7_SOURCE.zip \
            | tee \
            release/N11_LAUNCHER_7_SOURCE.zip.sha256

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: N11-Launcher-7-Source
          if-no-files-found: error
          path: |
            release/N11_LAUNCHER_7_SOURCE.zip
            release/N11_LAUNCHER_7_SOURCE.zip.sha256
