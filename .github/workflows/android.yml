name: N11 Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:

    name: Build N11 4.0 APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"


      - name: Show project
        run: |
          echo "=== ROOT ==="
          ls -la

          echo "=== N11_ANDROID ==="
          ls -la N11_ANDROID

          echo "=== APP ==="
          ls -la N11_ANDROID/app


      - name: Validate Android project
        run: |
          test -d N11_ANDROID
          test -d N11_ANDROID/app

          test -f N11_ANDROID/settings.gradle.kts
          test -f N11_ANDROID/build.gradle.kts

          echo "Android project structure OK"


      - name: Install Gradle
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-9.4.1-bin.zip \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-9.4.1/bin" >> "$GITHUB_PATH"


      - name: Check Gradle
        run: |
          gradle --version


      - name: Build N11 APK
        working-directory: N11_ANDROID
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace


      - name: Check APK
        run: |
          test -f \
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk

          echo "================================"
          echo "N11 APK GERADO COM SUCESSO"
          echo "================================"

          ls -lh \
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk


      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk


      - name: Verify 16 KB alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c -P 16 4 \
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk


      - name: Generate SHA256
        run: |
          sha256sum \
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk \
            > N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk.sha256

          cat \
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk.sha256


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: N11-4.0-debug-APK
          path: |
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk
            N11_ANDROID/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
